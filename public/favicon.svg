<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded green background -->
  <rect width="64" height="64" rx="14" ry="14" fill="#137a50"/>

  <!-- Plate circle -->
  <circle cx="32" cy="33" r="14" fill="none" stroke="white" stroke-width="2.8"/>
  <!-- Inner plate ring -->
  <circle cx="32" cy="33" r="9" fill="none" stroke="white" stroke-width="1.4" opacity="0.5"/>

  <!-- Fork (left of plate) -->
  <!-- Handle -->
  <line x1="13" y1="44" x2="13" y2="35" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Tines base -->
  <line x1="13" y1="35" x2="13" y2="26" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left tine -->
  <line x1="11" y1="26" x2="11" y2="20" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right tine -->
  <line x1="15" y1="26" x2="15" y2="20" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Cross bar -->
  <line x1="11" y1="28" x2="15" y2="28" stroke="white" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Spoon (right of plate) -->
  <!-- Handle -->
  <line x1="51" y1="44" x2="51" y2="30" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bowl -->
  <ellipse cx="51" cy="23" rx="4" ry="5.5" fill="white"/>
</svg>